[project]
name = "agroritmo"
version = "1.0.0"
description = "Plataforma de simulação e otimização de operações de colheita e transporte de grãos"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "simpy>=4.1", "ortools>=9.10", "pydantic>=2.6", "numpy>=1.26", "pandas>=2.2", "streamlit>=1.40",
    "plotly>=5.20", "reportlab>=4.0", "matplotlib>=3.8", "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agroritmo*"]

[tool.setuptools.package-data]
"agroritmo.ui.components" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
