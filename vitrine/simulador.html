<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0E1316; --panel:#151C21; --borda:#25313A; --txt:#E4EAEF; --suave:#93A1AD; --verde:#2FA866; --ambar:#F0A73A; --verm:#E0524D; --azul:#3D7BE0; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0E1316; color:var(--txt); font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size:13px; }
  #app { height: 700px; display:flex; flex-direction:column; gap:8px; }
  .top { display:flex; gap:8px; align-items:stretch; }
  .clock { background:var(--panel); border:1px solid var(--borda); border-radius:8px; padding:6px 12px; min-width:168px; }
  .clock .r { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .clock .s { color:var(--suave); font-size:11px; margin-top:1px; min-height:14px; }
  .kpis { flex:1; display:grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap:6px; }
  .k { background:var(--panel); border:1px solid var(--borda); border-radius:8px; padding:5px 8px; overflow:hidden; }
  .k .l { color:var(--suave); font-size:10px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .k .v { font-size:16px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; white-space:nowrap; }
  .k .v small { font-size:11px; color:var(--suave); font-weight:400; margin-left:2px; }
  .k.alerta { border-color:#6b4a14; } .k.alerta .v { color:var(--ambar); }
  .k.critico { border-color:#6b2522; } .k.critico .v { color:var(--verm); }
  .ctl { display:flex; gap:6px; align-items:center; background:var(--panel); border:1px solid var(--borda); border-radius:8px; padding:6px 8px; flex-wrap:wrap; }
  button, select { background:#1d262d; color:var(--txt); border:1px solid #33424d; border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  button:hover, select:hover { border-color:#4b5f6d; }
  button.play { background:var(--verde); border-color:var(--verde); color:#06130b; font-weight:700; min-width:92px; }
  .sep { width:1px; height:22px; background:var(--borda); margin:0 4px; }
  input[type=range] { flex:1; min-width:180px; accent-color: var(--verde); }
  .lbl { color:var(--suave); font-size:11px; }
  .main { flex:1; display:flex; gap:8px; min-height:0; }
  .cvwrap { flex:1; position:relative; background:var(--panel); border:1px solid var(--borda); border-radius:8px; overflow:hidden; min-width:0; }
  canvas { width:100%; height:100%; display:block; }
  .side { width:250px; background:var(--panel); border:1px solid var(--borda); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; min-height:0; }
  .side .ttl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--suave); margin-bottom:6px; }
  #ticker { overflow:hidden; flex:1; display:flex; flex-direction:column; gap:5px; }
  .ev { font-size:11.5px; line-height:1.3; border-left:3px solid #33424d; padding:2px 0 2px 7px; }
  .ev .t { color:var(--suave); font-variant-numeric:tabular-nums; margin-right:4px; }
  .ev .r { font-weight:600; margin-right:3px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--suave); padding:0 2px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  #tip { position:absolute; pointer-events:none; background:#0b1013ee; border:1px solid #3a4a55; border-radius:6px; padding:6px 8px; font-size:12px; display:none; z-index:5; max-width:260px; line-height:1.35; }
  .prov { color:var(--suave); font-size:10.5px; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(4, minmax(0,1fr)); } .side { width:220px; } }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="clock"><div class="r" id="relogio">D1 00:00</div><div class="s" id="cond"></div></div>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="ctl">
    <button id="bRestart" title="Reiniciar">⏮ Reiniciar</button>
    <button id="bBack" title="Voltar 15 min">−15 min</button>
    <button id="bPlay" class="play">▶ Iniciar</button>
    <button id="bStep" title="Avançar 15 min">+15 min</button>
    <span class="sep"></span>
    <span class="lbl">Velocidade</span>
    <select id="sVel">
      <option value="5">5 min/s</option><option value="15">15 min/s</option><option value="30">30 min/s</option>
      <option value="60" selected>1 h/s</option><option value="180">3 h/s</option><option value="360">6 h/s</option><option value="720">12 h/s</option>
    </select>
    <span class="sep"></span>
    <select id="sEv">
      <option value="ESPERA_CAMINHAO_INICIO">Próxima: colheitadeira sem caminhão</option>
      <option value="FILA">Próxima: fila na unidade ≥ 2</option>
      <option value="FALHA">Próxima: falha mecânica</option>
      <option value="PARADA_CLIMA">Próxima: parada por clima</option>
      <option value="TALHAO_CONCLUIDO">Próximo: talhão concluído</option>
    </select>
    <button id="bEv">Ir ⏭</button>
    <span class="sep"></span>
    <input type="range" id="rT" min="0" max="100" step="1" value="0">
  </div>
  <div class="main">
    <div class="cvwrap" id="wrap"><canvas id="cv"></canvas><div id="tip"></div></div>
    <div class="side"><div class="ttl">Eventos registrados pelo simulador</div><div id="ticker"></div>
      <div class="prov">Posições e cores derivadas dos segmentos de estado da simulação (semente fixa). Viagens interpoladas pelo tempo do próprio segmento.</div></div>
  </div>
  <div class="legend" id="legend"></div>
</div>

  fila.sort((a, b) => a[0] - b[0]);
  fila.forEach((e, i) => truckIcon(QUEUE0.x + (i % 7) * 18, QUEUE0.y + Math.floor(i / 7) * 14, e[2], e[3], e[1].cap, e[1].id, ` · posição ${i + 1} na fila`));
  moega.sort((a, b) => a[0] - b[0]);
  moega.forEach((e, i) => { const p = PITS[Math.min(i, PITS.length - 1)]; truckIcon(p.x + 2, p.y - 1, e[2], e[3], e[1].cap, e[1].id, ` · moega ${i + 1}`); });
  patio.forEach((e, i) => truckIcon(PARK0.x + (i % 8) * 18, PARK0.y + Math.floor(i / 8) * 14, e[2], e[3], e[1].cap, e[1].id, ''));
  if (fila.length >= 2) txt(`${fila.length} caminhões aguardando`, QUEUE0.x, QUEUE0.y + 14 * Math.ceil(fila.length / 7) + 12, '#ff8a85', 11, 700);
  // fluxo
  const k = Math.min(P.serie.colhido.length - 1, Math.max(0, Math.floor(t / P.passo)));
  txt(`em trânsito: ${fmt(P.serie.transito[k], 1)} t`, (J.x + G.x) / 2, G.y - 12, '#9cc0ff', 10.5, 600, 'center');
  txt(`recebido: ${fmt(P.serie.entregue[k], 0)} t`, U.x + 12, U.y + U.h - 12, '#7fe0a8', 11, 700);
}

// ------------------------------------------------------------------ painel
const kEl = document.getElementById('kpis');
function kpis() {
  const k = Math.min(P.serie.colhido.length - 1, Math.max(0, Math.floor(t / P.passo))), s = P.serie;
  let area = 0; for (const c of P.campos) area += valAt(c.prog, t);
  const itens = [
    ['Colhido', fmt(s.colhido[k], 0), 't', ''], ['Entregue', fmt(s.entregue[k], 0), 't', ''],
    ['Área concluída', fmt(area / P.area_total * 100, 1), '%', ''], ['Em tanques', fmt(s.tanques[k], 1), 't', ''],
    ['Caminhões no campo', fmt(s.campo[k], 1), 't', ''], ['Em trânsito', fmt(s.transito[k], 1), 't', ''],
    ['Fila na unidade', fmt(s.fila_n[k], 0), `cam. · ${fmt(s.fila_t[k], 0)} t`, s.fila_n[k] >= 3 ? 'critico' : s.fila_n[k] >= 1 ? 'alerta' : ''],
    ['Colheitadeiras sem caminhão', fmt(s.colh_aguard[k], 0), 'máq.', s.colh_aguard[k] >= 1 ? 'critico' : ''],
  ];
  kEl.innerHTML = itens.map(i => `<div class="k ${i[3]}"><div class="l">${i[0]}</div><div class="v">${i[1]}<small>${i[2]}</small></div></div>`).join('');
  document.getElementById('relogio').textContent = rel(t);
  const cond = [];
  if (inWin(P.chuvas, t)) cond.push('chuva'); else if (inWin(P.bloqueio, t)) cond.push('secagem');
  cond.push(inWin(P.turno, t) ? 'turno de colheita' : 'fora do turno');
  if (!inWin(P.unidade.janelas, t)) cond.push('unidade fechada');
  if (t >= T_MAX) cond.push(P.concluida ? 'operação concluída' : 'fim da janela');
  document.getElementById('cond').textContent = cond.join(' · ');
}
const tk = document.getElementById('ticker');
const CORES_EV = { ESPERA_CAMINHAO_INICIO: '#F0A73A', FALHA: '#D04BC4', FALHA_INFORMADA: '#D04BC4', PARADA_CLIMA: '#6F8396', TALHAO_CONCLUIDO: '#2FA866', OPERACAO_CONCLUIDA: '#2FA866', CHEGADA_UNIDADE: '#3D7BE0', SAIDA_CAMPO: '#3D7BE0', FIM_DESCARGA: '#38B6C4' };
let ultimoIdx = -2;
function ticker() {
  const i = bs(P.eventos, t); if (i === ultimoIdx) return; ultimoIdx = i;
  const out = []; for (let j = i; j >= 0 && out.length < 14; j--) { const e = P.eventos[j];
    out.push(`<div class="ev" style="border-left-color:${CORES_EV[e[1]] || '#33424d'}"><span class="t">${rel(e[0])}</span><span class="r">${e[2]}</span>${e[3]}</div>`); }
  tk.innerHTML = out.join('') || '<div class="ev">Nenhum evento até este instante.</div>';
}
document.getElementById('legend').innerHTML = P.estados.filter(s => !['concluida', 'concluido'].includes(s.id))
  .map(s => `<span><i style="background:${s.cor}"></i>${s.rotulo}</span>`).join('') + '<span><i style="background:#F7E27A"></i>Anel: nível do tanque</span>';

// ------------------------------------------------------------------ controles
const rT = document.getElementById('rT'), bPlay = document.getElementById('bPlay'), sVel = document.getElementById('sVel');
rT.max = Math.ceil(T_MAX);
function render() { rT.value = t; kpis(); ticker(); draw(); }
function setPlay(v) { playing = v && t < T_MAX; bPlay.textContent = playing ? '⏸ Pausar' : (t >= T_MAX ? '✓ Fim' : '▶ Iniciar'); last = null; if (playing) requestAnimationFrame(loop); }
function loop(ts) { if (!playing) return; if (last !== null) { t = Math.min(T_MAX, t + (ts - last) / 1000 * Number(sVel.value)); } last = ts; render(); if (t >= T_MAX) { setPlay(false); return; } requestAnimationFrame(loop); }
bPlay.onclick = () => setPlay(!playing);
document.getElementById('bRestart').onclick = () => { t = Math.max(0, P.t_inicio - 150); setPlay(false); render(); };
document.getElementById('bStep').onclick = () => { t = Math.min(T_MAX, t + 15); render(); };
document.getElementById('bBack').onclick = () => { t = Math.max(0, t - 15); render(); };
rT.oninput = () => { t = Number(rT.value); render(); };
document.getElementById('bEv').onclick = () => {
  const tipo = document.getElementById('sEv').value; let alvo = null;
  if (tipo === 'FILA') { const s = P.serie.fila_n; for (let k = Math.floor(t / P.passo) + 1; k < s.length; k++) if (s[k] >= 2) { alvo = k * P.passo; break; } }
  else { for (const e of P.eventos) if (e[0] > t + 0.01 && (e[1] === tipo || (tipo === 'FALHA' && e[1] === 'FALHA_INFORMADA'))) { alvo = e[0]; break; } }
  if (alvo === null) { document.getElementById('cond').textContent = 'Nenhuma ocorrência posterior deste tipo'; return; }
  t = alvo + 0.01; setPlay(false); render();
};
cv.addEventListener('mousemove', ev => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (x >= h[0] && x <= h[0] + h[2] && y >= h[1] && y <= h[1] + h[3]) {
    tip.innerHTML = h[4]; tip.style.display = 'block'; tip.style.left = Math.min(x + 14, W - 250) + 'px'; tip.style.top = (y + 12) + 'px'; return; } }
  tip.style.display = 'none';
});
cv.addEventListener('mouseleave', () => tip.style.display = 'none');
window.addEventListener('resize', () => { layout(); render(); });
layout(); render();
</script>
